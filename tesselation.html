<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tessellated Plane</title>
<style>
  body { margin: 0; overflow: hidden; }
  canvas { display: block; }
  #controls {
    position: absolute; top: 16px; left: 16px;
    background: rgba(0,0,0,0.6); color: #fff; padding: 12px 16px;
    border-radius: 8px; font-family: sans-serif; font-size: 14px;
  }
  #controls label { display: block; margin-bottom: 4px; }
  #controls input { width: 200px; }
</style>
</head>
<body>
<div id="controls">
  <label>Amplitude: <span id="ampValue">1.0</span></label>
  <input type="range" id="ampSlider" min="0" max="5" step="0.01" value="1">
</div>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x222222);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 5, 8);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

// Image aspect: 3055 x 1563 → ratio ~1.954
const aspect = 3055 / 1563;
const shortSide = 5;
const longSide = shortSide * aspect;
const subdivisionsShort = 6;
const subdivisionsLong = Math.round(subdivisionsShort * aspect);
const stddev = 0.05 * shortSide;

// Box-Muller normal random
function randNormal(mean, sd) {
  let u, v;
  do { u = Math.random(); } while (u === 0);
  v = Math.random();
  return mean + sd * Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}

const texture = new THREE.TextureLoader().load('topview.jpg');

// Continuous mesh: shared vertices, each rectangle split into 2 triangles.
// Vertices are on a grid (subdivisionsLong+1) x (subdivisionsShort+1).
const vertsX = subdivisionsLong + 1;
const vertsZ = subdivisionsShort + 1;
const positions = [];
const uvs = [];
const indices = [];

// Create vertices with random Y offsets, store base offsets for slider
const baseY = [];
for (let iz = 0; iz < vertsZ; iz++) {
  for (let ix = 0; ix < vertsX; ix++) {
    const x = -longSide / 2 + (ix / subdivisionsLong) * longSide;
    const z = -shortSide / 2 + (iz / subdivisionsShort) * shortSide;
    const y = randNormal(0, stddev);
    baseY.push(y);
    positions.push(x, y, z);
    uvs.push(ix / subdivisionsLong, 1 - iz / subdivisionsShort);
  }
}

// Create triangle indices (2 tris per cell)
for (let iz = 0; iz < subdivisionsShort; iz++) {
  for (let ix = 0; ix < subdivisionsLong; ix++) {
    const a = iz * vertsX + ix;
    const b = a + 1;
    const c = a + vertsX;
    const d = c + 1;
    indices.push(a, b, d);
    indices.push(a, d, c);
  }
}

const geometry = new THREE.BufferGeometry();
geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
geometry.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
geometry.setIndex(indices);
geometry.computeVertexNormals();

const material = new THREE.MeshStandardMaterial({
  map: texture,
  side: THREE.DoubleSide,
});
const plane = new THREE.Mesh(geometry, material);
scene.add(plane);

// Wireframe edges on all triangle edges
const wireframe = new THREE.WireframeGeometry(geometry);
const lineMaterial = new THREE.LineBasicMaterial({ color: 0x000000, opacity: 0.3, transparent: true });
const wireLines = new THREE.LineSegments(wireframe, lineMaterial);
scene.add(wireLines);

// Axes helper (R=X, G=Y, B=Z)
const axes = new THREE.AxesHelper(2);
scene.add(axes);

// Amplitude slider
const slider = document.getElementById('ampSlider');
const ampLabel = document.getElementById('ampValue');
slider.addEventListener('input', () => {
  const amp = parseFloat(slider.value);
  ampLabel.textContent = amp.toFixed(2);
  const pos = geometry.attributes.position.array;
  for (let i = 0; i < baseY.length; i++) {
    pos[i * 3 + 1] = baseY[i] * amp;
  }
  geometry.attributes.position.needsUpdate = true;
  geometry.computeVertexNormals();
  // Rebuild wireframe to match updated positions
  wireLines.geometry.dispose();
  wireLines.geometry = new THREE.WireframeGeometry(geometry);
});

const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
scene.add(ambientLight);

const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
dirLight.position.set(5, 10, 5);
scene.add(dirLight);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
