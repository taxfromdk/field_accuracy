<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soccer Field Distance Measure</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            background: #1a1a2e;
            font-family: 'Segoe UI', sans-serif;
            padding: 40px;
        }
        .container {
            display: flex;
            align-items: flex-start;
            gap: 28px;
        }
        .slider-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 112px;
        }
        .slider-wrapper {
            position: relative;
            height: 560px;
            display: flex;
            align-items: center;
        }
        .vertical-slider {
            writing-mode: vertical-lr;
            direction: rtl;
            width: 42px;
            height: 100%;
            cursor: pointer;
        }
        .vertical-slider.height {
            accent-color: #ffeb3b;
        }
        .vertical-slider.precision {
            accent-color: #4fc3f7;
        }
        .slider-markers {
            position: absolute;
            left: 50px;
            top: 0;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            pointer-events: none;
        }
        .slider-marker {
            color: #fff;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 7px;
        }
        .slider-marker::before {
            content: '';
            width: 11px;
            height: 2px;
            background: #fff;
        }
        .slider-marker.middle {
            position: absolute;
            top: 77.8%;
        }
        .slider-marker.precision-middle {
            position: absolute;
            top: 50%;
        }
        .slider-label {
            color: #fff;
            font-size: 17px;
            font-weight: 500;
            margin-bottom: 14px;
        }
        .slider-value {
            font-size: 20px;
            font-weight: bold;
            margin-top: 14px;
            white-space: nowrap;
        }
        .slider-value.height {
            color: #ffeb3b;
        }
        .slider-value.precision {
            color: #4fc3f7;
        }
        .coordinates {
            color: #fff;
            font-size: 16px;
            margin-top: 40px;
            line-height: 1.8;
            white-space: nowrap;
        }
        .coordinates .point-label {
            font-weight: bold;
        }
        .coordinates .point-a {
            color: #ff5722;
        }
        .coordinates .point-b {
            color: #2196f3;
        }
        .field-select {
            margin-top: 30px;
            color: #fff;
            font-size: 14px;
        }
        .field-select label {
            display: block;
            margin: 8px 0;
            cursor: pointer;
        }
        .field-select input {
            margin-right: 8px;
            cursor: pointer;
        }
        .field-select-title {
            font-weight: 500;
            margin-bottom: 10px;
            font-size: 16px;
        }
        .canvas-container {
            display: flex;
            flex-direction: column;
            gap: 28px;
        }
        canvas {
            display: block;
            cursor: grab;
        }
        canvas:active {
            cursor: grabbing;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="slider-container">
            <div class="slider-label">Precision</div>
            <div class="slider-wrapper">
                <input type="range" id="precision-slider" class="vertical-slider precision"
                       min="0" max="2" step="0.01" value="0">
                <div class="slider-markers">
                    <span class="slider-marker">2°</span>
                    <span class="slider-marker precision-middle">1°</span>
                    <span class="slider-marker">0°</span>
                </div>
            </div>
            <div class="slider-value precision" id="precision-value">0.00°</div>
        </div>
        <div class="slider-container">
            <div class="slider-label">Height</div>
            <div class="slider-wrapper">
                <input type="range" id="height-slider" class="vertical-slider height"
                       min="2.7" max="7.2" step="0.01" value="3.7">
                <div class="slider-markers">
                    <span class="slider-marker">7.20 m</span>
                    <span class="slider-marker middle">3.70 m</span>
                    <span class="slider-marker">2.70 m</span>
                </div>
            </div>
            <div class="slider-value height" id="height-value">3.70 m</div>
            <div class="coordinates">
                <div><span class="point-label point-a">A:</span> <span id="coord-a">(0.0, -37.0)</span></div>
                <div><span class="point-label point-b">B:</span> <span id="coord-b">(52.5, 34.0)</span></div>
            </div>
            <div class="field-select">
                <div class="field-select-title">Field Type</div>
                <label><input type="radio" name="field-type" value="soccer11" checked> 11-man Soccer</label>
                <label><input type="radio" name="field-type" value="soccer7"> 7-man Soccer</label>
                <label><input type="radio" name="field-type" value="basketball"> Basketball</label>
            </div>
        </div>
        <div class="canvas-container">
            <canvas id="field-canvas" width="1288" height="980"></canvas>
            <canvas id="triangle-canvas" width="1680" height="520"></canvas>
        </div>
    </div>

    <script>
        // Field configurations
        const fieldConfigs = {
            soccer11: {
                length: 105,
                width: 68,
                name: '11-man Soccer',
                bgColor: '#2d8a3e',
                lineColor: '#fff'
            },
            soccer7: {
                length: 60,
                width: 40,
                name: '7-man Soccer',
                bgColor: '#2d8a3e',
                lineColor: '#fff'
            },
            basketball: {
                length: 28,
                width: 15,
                name: 'Basketball',
                bgColor: '#e65c00',
                lineColor: '#fff'
            }
        };

        let currentFieldType = 'soccer11';
        const BUFFER = 5;

        // Dynamic field dimensions
        function getFieldConfig() {
            return fieldConfigs[currentFieldType];
        }

        function getScale() {
            return 1120 / getFieldConfig().length;
        }

        function getFieldPxHeight() {
            const config = getFieldConfig();
            return (config.width / config.length) * 1120;
        }

        // Field offset in canvas (margin for points outside field)
        const FIELD_OFFSET_X = 56;
        const FIELD_OFFSET_Y = 140;
        const FIELD_PX_WIDTH = 1120;

        // Canvas elements
        const fieldCanvas = document.getElementById('field-canvas');
        const fieldCtx = fieldCanvas.getContext('2d');
        const triangleCanvas = document.getElementById('triangle-canvas');
        const triangleCtx = triangleCanvas.getContext('2d');

        // State
        let currentHeight = 3.7;
        let currentPrecision = 0.0;
        let activePoint = null;
        let dragOffset = { x: 0, y: 0 };

        // Point positions in field coordinates (meters, center origin, Y up)
        let fieldPositions = {
            A: { x: 0, y: -37 },
            B: { x: 52.5, y: 34 }
        };

        // Convert field coords to canvas coords
        function fieldToCanvas(fieldX, fieldY) {
            const scale = getScale();
            const fieldPxHeight = getFieldPxHeight();
            return {
                x: FIELD_OFFSET_X + FIELD_PX_WIDTH / 2 + fieldX * scale,
                y: FIELD_OFFSET_Y + fieldPxHeight / 2 - fieldY * scale
            };
        }

        // Convert canvas coords to field coords
        function canvasToField(canvasX, canvasY) {
            const scale = getScale();
            const fieldPxHeight = getFieldPxHeight();
            return {
                x: (canvasX - FIELD_OFFSET_X - FIELD_PX_WIDTH / 2) / scale,
                y: (FIELD_OFFSET_Y + fieldPxHeight / 2 - canvasY) / scale
            };
        }

        function clamp(value, min, max) {
            return Math.min(Math.max(value, min), max);
        }

        // Draw the field based on current type
        function drawField() {
            const ctx = fieldCtx;
            ctx.clearRect(0, 0, fieldCanvas.width, fieldCanvas.height);

            const config = getFieldConfig();
            const scale = getScale();
            const ox = FIELD_OFFSET_X;
            const oy = FIELD_OFFSET_Y;
            const w = FIELD_PX_WIDTH;
            const h = getFieldPxHeight();

            // Field background
            ctx.fillStyle = config.bgColor;
            ctx.fillRect(ox, oy, w, h);
            ctx.strokeStyle = config.lineColor;
            ctx.lineWidth = 3;
            ctx.strokeRect(ox, oy, w, h);

            // Draw sport-specific markings
            if (currentFieldType === 'soccer11') {
                drawSoccer11Markings(ctx, ox, oy, w, h, scale);
            } else if (currentFieldType === 'soccer7') {
                drawSoccer7Markings(ctx, ox, oy, w, h, scale);
            } else if (currentFieldType === 'basketball') {
                drawBasketballMarkings(ctx, ox, oy, w, h, scale);
            }

            // X and Y axes at origin
            const centerX = ox + w / 2;
            const centerY = oy + h / 2;
            const axisLength = 60;
            const arrowSize = 8;
            ctx.strokeStyle = '#000';
            ctx.fillStyle = '#000';
            ctx.lineWidth = 2;

            // X axis (pointing right)
            ctx.beginPath();
            ctx.moveTo(centerX + 10, centerY);
            ctx.lineTo(centerX + axisLength, centerY);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(centerX + axisLength, centerY);
            ctx.lineTo(centerX + axisLength - arrowSize, centerY - arrowSize / 2);
            ctx.lineTo(centerX + axisLength - arrowSize, centerY + arrowSize / 2);
            ctx.closePath();
            ctx.fill();
            ctx.font = '14px Segoe UI';
            ctx.textAlign = 'center';
            ctx.fillText('X', centerX + axisLength + 10, centerY + 4);

            // Y axis (pointing up)
            ctx.beginPath();
            ctx.moveTo(centerX, centerY - 10);
            ctx.lineTo(centerX, centerY - axisLength);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(centerX, centerY - axisLength);
            ctx.lineTo(centerX - arrowSize / 2, centerY - axisLength + arrowSize);
            ctx.lineTo(centerX + arrowSize / 2, centerY - axisLength + arrowSize);
            ctx.closePath();
            ctx.fill();
            ctx.fillText('Y', centerX, centerY - axisLength - 8);

            // Field dimension labels
            ctx.fillStyle = 'rgba(0,0,0,0.6)';
            ctx.fillRect(ox + w / 2 - 42, oy - 42, 84, 28);
            ctx.fillStyle = '#fff';
            ctx.font = '17px Segoe UI';
            ctx.textAlign = 'center';
            ctx.fillText(config.length + ' m', ox + w / 2, oy - 21);

            ctx.save();
            ctx.translate(ox + w + 42, oy + h / 2);
            ctx.rotate(Math.PI / 2);
            ctx.fillStyle = 'rgba(0,0,0,0.6)';
            ctx.fillRect(-28, -14, 56, 28);
            ctx.fillStyle = '#fff';
            ctx.fillText(config.width + ' m', 0, 6);
            ctx.restore();
        }

        function drawSoccer11Markings(ctx, ox, oy, w, h, scale) {
            ctx.strokeStyle = '#fff';
            ctx.fillStyle = '#fff';
            ctx.lineWidth = 3;

            // Center line
            ctx.beginPath();
            ctx.moveTo(ox + w / 2, oy);
            ctx.lineTo(ox + w / 2, oy + h);
            ctx.stroke();

            // Center circle (9.15m radius)
            const centerCircleR = 9.15 * scale;
            ctx.beginPath();
            ctx.arc(ox + w / 2, oy + h / 2, centerCircleR, 0, Math.PI * 2);
            ctx.stroke();

            // Center spot
            ctx.beginPath();
            ctx.arc(ox + w / 2, oy + h / 2, 6, 0, Math.PI * 2);
            ctx.fill();

            // Penalty areas (16.5m from goal, 40.32m wide)
            const penaltyDepth = 16.5 * scale;
            const penaltyWidth = 40.32 * scale;
            ctx.strokeRect(ox, oy + h / 2 - penaltyWidth / 2, penaltyDepth, penaltyWidth);
            ctx.strokeRect(ox + w - penaltyDepth, oy + h / 2 - penaltyWidth / 2, penaltyDepth, penaltyWidth);

            // Goal areas (5.5m from goal, 18.32m wide)
            const goalAreaDepth = 5.5 * scale;
            const goalAreaWidth = 18.32 * scale;
            ctx.strokeRect(ox, oy + h / 2 - goalAreaWidth / 2, goalAreaDepth, goalAreaWidth);
            ctx.strokeRect(ox + w - goalAreaDepth, oy + h / 2 - goalAreaWidth / 2, goalAreaDepth, goalAreaWidth);

            // Penalty spots (11m from goal)
            const penaltySpotDist = 11 * scale;
            ctx.beginPath();
            ctx.arc(ox + penaltySpotDist, oy + h / 2, 6, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(ox + w - penaltySpotDist, oy + h / 2, 6, 0, Math.PI * 2);
            ctx.fill();

            // Penalty arcs
            ctx.beginPath();
            ctx.arc(ox + penaltySpotDist, oy + h / 2, centerCircleR, -0.93, 0.93);
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(ox + w - penaltySpotDist, oy + h / 2, centerCircleR, Math.PI - 0.93, Math.PI + 0.93);
            ctx.stroke();

            // Corner arcs (1m radius)
            const cornerR = 1 * scale;
            ctx.beginPath();
            ctx.arc(ox, oy, cornerR, 0, Math.PI / 2);
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(ox + w, oy, cornerR, Math.PI / 2, Math.PI);
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(ox, oy + h, cornerR, -Math.PI / 2, 0);
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(ox + w, oy + h, cornerR, Math.PI, Math.PI * 1.5);
            ctx.stroke();

            // Goals (7.32m wide)
            const goalWidth = 7.32 * scale;
            const goalDepth = 2 * scale;
            ctx.strokeRect(ox - goalDepth, oy + h / 2 - goalWidth / 2, goalDepth, goalWidth);
            ctx.strokeRect(ox + w, oy + h / 2 - goalWidth / 2, goalDepth, goalWidth);
        }

        function drawSoccer7Markings(ctx, ox, oy, w, h, scale) {
            ctx.strokeStyle = '#fff';
            ctx.fillStyle = '#fff';
            ctx.lineWidth = 3;

            // Center line
            ctx.beginPath();
            ctx.moveTo(ox + w / 2, oy);
            ctx.lineTo(ox + w / 2, oy + h);
            ctx.stroke();

            // Center circle (6m radius for 7-a-side)
            const centerCircleR = 6 * scale;
            ctx.beginPath();
            ctx.arc(ox + w / 2, oy + h / 2, centerCircleR, 0, Math.PI * 2);
            ctx.stroke();

            // Center spot
            ctx.beginPath();
            ctx.arc(ox + w / 2, oy + h / 2, 6, 0, Math.PI * 2);
            ctx.fill();

            // Penalty areas (10m from goal, 24m wide)
            const penaltyDepth = 10 * scale;
            const penaltyWidth = 24 * scale;
            ctx.strokeRect(ox, oy + h / 2 - penaltyWidth / 2, penaltyDepth, penaltyWidth);
            ctx.strokeRect(ox + w - penaltyDepth, oy + h / 2 - penaltyWidth / 2, penaltyDepth, penaltyWidth);

            // Penalty spots (8m from goal)
            const penaltySpotDist = 8 * scale;
            ctx.beginPath();
            ctx.arc(ox + penaltySpotDist, oy + h / 2, 6, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(ox + w - penaltySpotDist, oy + h / 2, 6, 0, Math.PI * 2);
            ctx.fill();

            // Corner arcs
            const cornerR = 1 * scale;
            ctx.beginPath();
            ctx.arc(ox, oy, cornerR, 0, Math.PI / 2);
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(ox + w, oy, cornerR, Math.PI / 2, Math.PI);
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(ox, oy + h, cornerR, -Math.PI / 2, 0);
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(ox + w, oy + h, cornerR, Math.PI, Math.PI * 1.5);
            ctx.stroke();

            // Goals (5m wide)
            const goalWidth = 5 * scale;
            const goalDepth = 1.5 * scale;
            ctx.strokeRect(ox - goalDepth, oy + h / 2 - goalWidth / 2, goalDepth, goalWidth);
            ctx.strokeRect(ox + w, oy + h / 2 - goalWidth / 2, goalDepth, goalWidth);
        }

        function drawBasketballMarkings(ctx, ox, oy, w, h, scale) {
            // FIBA basketball court markings (28m x 15m)
            // Reference: Court is displayed with baselines on left/right, sidelines on top/bottom
            ctx.strokeStyle = '#fff';
            ctx.fillStyle = '#fff';
            ctx.lineWidth = 3;

            const centerX = ox + w / 2;
            const centerY = oy + h / 2;

            // Center line (half-court line)
            ctx.beginPath();
            ctx.moveTo(centerX, oy);
            ctx.lineTo(centerX, oy + h);
            ctx.stroke();

            // Center circle (1.8m radius)
            const centerCircleR = 1.8 * scale;
            ctx.beginPath();
            ctx.arc(centerX, centerY, centerCircleR, 0, Math.PI * 2);
            ctx.stroke();

            // FIBA dimensions
            const basketFromBaseline = 1.575; // meters - center of hoop from baseline
            const keyWidth = 4.9;             // meters - width of paint/key
            const keyDepth = 5.8;             // meters - from baseline to free throw line
            const threePointRadius = 6.75;    // meters - from center of basket
            const cornerThreeDist = 0.9;      // meters - corner three from sideline
            const restrictedRadius = 1.25;    // meters - no-charge semicircle
            const backboardFromBaseline = 1.2;// meters
            const backboardWidth = 1.8;       // meters
            const hoopRadius = 0.225;         // meters (45cm diameter)
            const ftCircleRadius = 1.8;       // meters

            // Convert to pixels
            const basketX = basketFromBaseline * scale;
            const keyW = keyWidth * scale;
            const keyD = keyDepth * scale;
            const threeR = threePointRadius * scale;
            const cornerDist = cornerThreeDist * scale;
            const restrictedR = restrictedRadius * scale;
            const backboardX = backboardFromBaseline * scale;
            const backboardW = backboardWidth * scale;
            const hoopR = hoopRadius * scale;
            const ftCircleR = ftCircleRadius * scale;

            // ===== LEFT SIDE =====
            const leftBasketCenterX = ox + basketX;

            // Paint/Key area (rectangle from baseline)
            ctx.strokeRect(ox, centerY - keyW / 2, keyD, keyW);

            // Free throw circle (at end of key)
            // Full circle, but only the part outside the key is typically visible
            ctx.beginPath();
            ctx.arc(ox + keyD, centerY, ftCircleR, 0, Math.PI * 2);
            ctx.stroke();

            // Three-point line
            // Corner sections are straight lines parallel to sideline, 0.9m from sideline
            // Arc connects them, centered on basket

            // Calculate where arc meets the corner line (0.9m from sideline)
            // The corner line is at x = ox (baseline), distance from basket center
            // Arc equation: distance from basket = 6.75m
            // At the baseline, we need to find y where the arc would be
            const arcStartX = ox + cornerDist; // Where straight line would meet arc
            // Distance from basket to this x position
            const dxFromBasket = cornerDist - basketFromBaseline;
            // Calculate y offset using Pythagorean theorem
            const arcMeetY = Math.sqrt(threeR * threeR - dxFromBasket * dxFromBasket);

            // Top corner three (straight line from baseline to arc)
            ctx.beginPath();
            ctx.moveTo(ox, centerY - arcMeetY);
            ctx.lineTo(ox, oy); // to top sideline
            ctx.stroke();

            // Bottom corner three
            ctx.beginPath();
            ctx.moveTo(ox, centerY + arcMeetY);
            ctx.lineTo(ox, oy + h); // to bottom sideline
            ctx.stroke();

            // Three-point arc (from where it meets top corner to bottom corner)
            const arcAngle = Math.asin(arcMeetY / threeR);
            ctx.beginPath();
            ctx.arc(leftBasketCenterX, centerY, threeR, -arcAngle, arcAngle);
            ctx.stroke();

            // Restricted area (no-charge semicircle)
            ctx.beginPath();
            ctx.arc(leftBasketCenterX, centerY, restrictedR, -Math.PI / 2, Math.PI / 2);
            ctx.stroke();
            // Close the restricted area with a line
            ctx.beginPath();
            ctx.moveTo(leftBasketCenterX, centerY - restrictedR);
            ctx.lineTo(leftBasketCenterX, centerY + restrictedR);
            ctx.stroke();

            // Backboard
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(ox + backboardX, centerY - backboardW / 2);
            ctx.lineTo(ox + backboardX, centerY + backboardW / 2);
            ctx.stroke();
            ctx.lineWidth = 3;

            // Hoop (ring)
            ctx.beginPath();
            ctx.arc(leftBasketCenterX, centerY, hoopR, 0, Math.PI * 2);
            ctx.stroke();

            // ===== RIGHT SIDE (mirror) =====
            const rightBasketCenterX = ox + w - basketX;

            // Paint/Key area
            ctx.strokeRect(ox + w - keyD, centerY - keyW / 2, keyD, keyW);

            // Free throw circle
            ctx.beginPath();
            ctx.arc(ox + w - keyD, centerY, ftCircleR, 0, Math.PI * 2);
            ctx.stroke();

            // Top corner three
            ctx.beginPath();
            ctx.moveTo(ox + w, centerY - arcMeetY);
            ctx.lineTo(ox + w, oy);
            ctx.stroke();

            // Bottom corner three
            ctx.beginPath();
            ctx.moveTo(ox + w, centerY + arcMeetY);
            ctx.lineTo(ox + w, oy + h);
            ctx.stroke();

            // Three-point arc
            ctx.beginPath();
            ctx.arc(rightBasketCenterX, centerY, threeR, Math.PI - arcAngle, Math.PI + arcAngle);
            ctx.stroke();

            // Restricted area
            ctx.beginPath();
            ctx.arc(rightBasketCenterX, centerY, restrictedR, Math.PI / 2, Math.PI * 1.5);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(rightBasketCenterX, centerY - restrictedR);
            ctx.lineTo(rightBasketCenterX, centerY + restrictedR);
            ctx.stroke();

            // Backboard
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(ox + w - backboardX, centerY - backboardW / 2);
            ctx.lineTo(ox + w - backboardX, centerY + backboardW / 2);
            ctx.stroke();
            ctx.lineWidth = 3;

            // Hoop
            ctx.beginPath();
            ctx.arc(rightBasketCenterX, centerY, hoopR, 0, Math.PI * 2);
            ctx.stroke();
        }

        // Draw points and connection
        function drawPoints() {
            const ctx = fieldCtx;
            const posA = fieldToCanvas(fieldPositions.A.x, fieldPositions.A.y);
            const posB = fieldToCanvas(fieldPositions.B.x, fieldPositions.B.y);

            // Calculate AB distance
            const dx = fieldPositions.B.x - fieldPositions.A.x;
            const dy = fieldPositions.B.y - fieldPositions.A.y;
            const abDistance = Math.sqrt(dx * dx + dy * dy);

            // Uncertainty ellipse around B
            const distance3D = Math.sqrt(abDistance * abDistance + currentHeight * currentHeight);
            const precisionRadians = currentPrecision * (Math.PI / 180);
            const angleAtObserver = Math.atan(abDistance / currentHeight);

            if (currentPrecision > 0) {
                // Compute uncertainty shape with 100 points around a cone
                const numPoints = 100;
                const uncertaintyPoints = [];

                // Direction vector from A to B (in field coordinates)
                const dirX = fieldPositions.B.x - fieldPositions.A.x;
                const dirY = fieldPositions.B.y - fieldPositions.A.y;
                const dirLen = Math.sqrt(dirX * dirX + dirY * dirY);

                // Normalized direction
                const dirNormX = dirX / dirLen;
                const dirNormY = dirY / dirLen;

                // Perpendicular direction (for lateral offset)
                const perpX = -dirNormY;
                const perpY = dirNormX;

                // Observer angle to target (from vertical)
                const baseAngle = Math.atan(abDistance / currentHeight);

                for (let i = 0; i < numPoints; i++) {
                    const theta = (i / numPoints) * Math.PI * 2;

                    // Angular offset in the direction of view (along AB line)
                    const alongOffset = Math.cos(theta) * precisionRadians;
                    // Angular offset perpendicular to view
                    const perpOffset = Math.sin(theta) * precisionRadians;

                    // New angle from vertical (along the viewing direction)
                    const newAngle = baseAngle + alongOffset;

                    // Distance along the ground in the viewing direction
                    const groundDist = currentHeight * Math.tan(newAngle);

                    // Lateral offset on the ground (perpendicular error)
                    // At this ground distance, the perpendicular angular error creates lateral displacement
                    const slantDist = currentHeight / Math.cos(newAngle);
                    const lateralDist = slantDist * Math.sin(perpOffset);

                    // Compute the point in field coordinates
                    const pointX = fieldPositions.A.x + dirNormX * groundDist + perpX * lateralDist;
                    const pointY = fieldPositions.A.y + dirNormY * groundDist + perpY * lateralDist;

                    // Convert to canvas coordinates
                    const canvasPos = fieldToCanvas(pointX, pointY);
                    uncertaintyPoints.push(canvasPos);
                }

                // Draw the uncertainty shape
                ctx.setLineDash([7, 7]);
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(uncertaintyPoints[0].x, uncertaintyPoints[0].y);
                for (let i = 1; i < uncertaintyPoints.length; i++) {
                    ctx.lineTo(uncertaintyPoints[i].x, uncertaintyPoints[i].y);
                }
                ctx.closePath();
                ctx.stroke();
                ctx.setLineDash([]);
            }

            // Distance line (dotted)
            ctx.setLineDash([14, 7]);
            ctx.strokeStyle = '#ffeb3b';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(posA.x, posA.y);
            ctx.lineTo(posB.x, posB.y);
            ctx.stroke();
            ctx.setLineDash([]);

            // Distance text
            const midX = (posA.x + posB.x) / 2;
            const midY = (posA.y + posB.y) / 2;
            ctx.fillStyle = 'rgba(0,0,0,0.7)';
            ctx.fillRect(midX - 56, midY - 17, 112, 34);
            ctx.fillStyle = '#ffeb3b';
            ctx.font = 'bold 20px Segoe UI';
            ctx.textAlign = 'center';
            ctx.fillText(abDistance.toFixed(2) + ' m', midX, midY + 7);

            // Point A
            ctx.fillStyle = '#ff5722';
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.arc(posA.x, posA.y, 22, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 20px Segoe UI';
            ctx.fillText('A', posA.x, posA.y + 7);

            // Point B (pin style)
            // Pin line
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(posB.x, posB.y);
            ctx.lineTo(posB.x, posB.y - 70);
            ctx.stroke();

            // Pin point
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(posB.x, posB.y, 6, 0, Math.PI * 2);
            ctx.fill();

            // Pin head
            ctx.fillStyle = '#2196f3';
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.arc(posB.x, posB.y - 70, 22, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            ctx.fillStyle = '#fff';
            ctx.fillText('B', posB.x, posB.y - 63);
        }

        // Draw triangle
        function drawTriangle() {
            const ctx = triangleCtx;
            ctx.clearRect(0, 0, triangleCanvas.width, triangleCanvas.height);

            const dx = fieldPositions.B.x - fieldPositions.A.x;
            const dy = fieldPositions.B.y - fieldPositions.A.y;
            const abDistance = Math.sqrt(dx * dx + dy * dy);

            const margin = 100;
            const baseY = 390;
            const scale = getScale();
            const abPx = abDistance * scale;
            const heightPx = currentHeight * scale;

            // Triangle vertices
            const x1 = margin, y1 = baseY;           // Bottom-left (right angle)
            const x2 = margin, y2 = baseY - heightPx; // Top-left
            const x3 = margin + abPx, y3 = baseY;    // Bottom-right

            // Triangle fill
            ctx.fillStyle = 'rgba(255,235,59,0.2)';
            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.lineTo(x3, y3);
            ctx.closePath();
            ctx.fill();

            // Triangle stroke
            ctx.strokeStyle = '#ffeb3b';
            ctx.lineWidth = 3;
            ctx.stroke();

            // Right angle marker
            const markerSize = 14;
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(x1, y1 - markerSize);
            ctx.lineTo(x1 + markerSize, y1 - markerSize);
            ctx.lineTo(x1 + markerSize, y1);
            ctx.stroke();

            // Height label
            ctx.fillStyle = '#2196f3';
            ctx.font = 'bold 20px Segoe UI';
            ctx.textAlign = 'right';
            ctx.fillText(currentHeight.toFixed(2) + ' m', x1 - 7, (y1 + y2) / 2 + 7);

            // AB label
            ctx.fillStyle = '#ffeb3b';
            ctx.textAlign = 'center';
            ctx.fillText('AB: ' + abDistance.toFixed(2) + ' m', (x1 + x3) / 2, y1 + 28);

            // Precision lines and brackets
            if (currentPrecision > 0.01) {
                const angleAtB = Math.atan(abDistance / currentHeight);
                const precisionRadians = currentPrecision * (Math.PI / 180);

                // Overshoot
                const overshootAngle = angleAtB + precisionRadians;
                const overshootAB = currentHeight * Math.tan(overshootAngle);
                const xOvershoot = margin + overshootAB * scale;

                // Undershoot
                const undershootAngle = angleAtB - precisionRadians;
                const undershootAB = currentHeight * Math.tan(undershootAngle);
                const xUndershoot = margin + undershootAB * scale;

                // Overshoot line
                ctx.setLineDash([7, 7]);
                ctx.strokeStyle = '#4fc3f7';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(x2, y2);
                ctx.lineTo(xOvershoot, y3);
                ctx.stroke();

                // Undershoot line
                ctx.strokeStyle = '#ff9800';
                ctx.beginPath();
                ctx.moveTo(x2, y2);
                ctx.lineTo(xUndershoot, y3);
                ctx.stroke();
                ctx.setLineDash([]);

                // Overshoot bracket and label
                const overshootError = overshootAB - abDistance;
                if (overshootError > 0.01) {
                    drawBracket(ctx, x3, xOvershoot, y3 + 7, '#4fc3f7');
                    ctx.fillStyle = '#4fc3f7';
                    ctx.font = 'bold 20px Segoe UI';
                    ctx.textAlign = 'center';
                    ctx.fillText('+' + overshootError.toFixed(2) + ' m', (x3 + xOvershoot) / 2, y3 + 49);
                }

                // Undershoot bracket and label
                const undershootError = abDistance - undershootAB;
                if (undershootError > 0.01) {
                    drawBracket(ctx, xUndershoot, x3, y3 + 56, '#ff9800');
                    ctx.fillStyle = '#ff9800';
                    ctx.fillText('-' + undershootError.toFixed(2) + ' m', (xUndershoot + x3) / 2, y3 + 98);
                }
            }
        }

        function drawBracket(ctx, x1, x2, y, color) {
            const midX = (x1 + x2) / 2;
            const h = 11;

            ctx.strokeStyle = color;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(x1, y);
            ctx.bezierCurveTo(x1, y + h, x1, y + h, midX - 7, y + h);
            ctx.lineTo(midX, y + h + 6);
            ctx.lineTo(midX + 7, y + h);
            ctx.bezierCurveTo(x2, y + h, x2, y + h, x2, y);
            ctx.stroke();
        }

        function draw() {
            drawField();
            drawPoints();
            drawTriangle();
            updateCoordinates();
        }

        // Mouse handling for field canvas
        function getMousePos(canvas, evt) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            return {
                x: (evt.clientX - rect.left) * scaleX,
                y: (evt.clientY - rect.top) * scaleY
            };
        }

        function getPointAtPos(pos) {
            const posA = fieldToCanvas(fieldPositions.A.x, fieldPositions.A.y);
            const posB = fieldToCanvas(fieldPositions.B.x, fieldPositions.B.y);

            const distA = Math.sqrt((pos.x - posA.x) ** 2 + (pos.y - posA.y) ** 2);
            // Check both pin point and pin head for B
            const distBPoint = Math.sqrt((pos.x - posB.x) ** 2 + (pos.y - posB.y) ** 2);
            const distBHead = Math.sqrt((pos.x - posB.x) ** 2 + (pos.y - (posB.y - 70)) ** 2);

            if (distA < 28) return 'A';
            if (distBPoint < 28 || distBHead < 28) return 'B';
            return null;
        }

        fieldCanvas.addEventListener('mousedown', (e) => {
            const pos = getMousePos(fieldCanvas, e);
            const point = getPointAtPos(pos);
            if (point) {
                activePoint = point;
                const canvasPos = fieldToCanvas(fieldPositions[point].x, fieldPositions[point].y);
                dragOffset.x = pos.x - canvasPos.x;
                dragOffset.y = pos.y - canvasPos.y;
            }
        });

        fieldCanvas.addEventListener('mousemove', (e) => {
            if (!activePoint) return;
            const pos = getMousePos(fieldCanvas, e);
            const fieldPos = canvasToField(pos.x - dragOffset.x, pos.y - dragOffset.y);

            const config = getFieldConfig();
            fieldPos.x = clamp(fieldPos.x, -config.length / 2 - BUFFER, config.length / 2 + BUFFER);
            fieldPos.y = clamp(fieldPos.y, -config.width / 2 - BUFFER, config.width / 2 + BUFFER);

            fieldPositions[activePoint] = fieldPos;
            draw();
        });

        fieldCanvas.addEventListener('mouseup', () => {
            activePoint = null;
        });

        fieldCanvas.addEventListener('mouseleave', () => {
            activePoint = null;
        });

        // Touch support
        fieldCanvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            const pos = getMousePos(fieldCanvas, touch);
            const point = getPointAtPos(pos);
            if (point) {
                activePoint = point;
                const canvasPos = fieldToCanvas(fieldPositions[point].x, fieldPositions[point].y);
                dragOffset.x = pos.x - canvasPos.x;
                dragOffset.y = pos.y - canvasPos.y;
            }
        });

        fieldCanvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (!activePoint) return;
            const touch = e.touches[0];
            const pos = getMousePos(fieldCanvas, touch);
            const fieldPos = canvasToField(pos.x - dragOffset.x, pos.y - dragOffset.y);

            const config = getFieldConfig();
            fieldPos.x = clamp(fieldPos.x, -config.length / 2 - BUFFER, config.length / 2 + BUFFER);
            fieldPos.y = clamp(fieldPos.y, -config.width / 2 - BUFFER, config.width / 2 + BUFFER);

            fieldPositions[activePoint] = fieldPos;
            draw();
        });

        fieldCanvas.addEventListener('touchend', () => {
            activePoint = null;
        });

        // Sliders
        const heightSlider = document.getElementById('height-slider');
        const heightValueDisplay = document.getElementById('height-value');
        const precisionSlider = document.getElementById('precision-slider');
        const precisionValueDisplay = document.getElementById('precision-value');
        const coordADisplay = document.getElementById('coord-a');
        const coordBDisplay = document.getElementById('coord-b');

        function updateCoordinates() {
            coordADisplay.textContent = `(${fieldPositions.A.x.toFixed(1)}m, ${fieldPositions.A.y.toFixed(1)}m)`;
            coordBDisplay.textContent = `(${fieldPositions.B.x.toFixed(1)}m, ${fieldPositions.B.y.toFixed(1)}m)`;
        }

        heightSlider.addEventListener('input', function() {
            currentHeight = parseFloat(this.value);
            heightValueDisplay.textContent = currentHeight.toFixed(2) + ' m';
            draw();
        });

        precisionSlider.addEventListener('input', function() {
            currentPrecision = parseFloat(this.value);
            precisionValueDisplay.textContent = currentPrecision.toFixed(2) + '°';
            draw();
        });

        // Field type radio buttons
        const fieldTypeRadios = document.querySelectorAll('input[name="field-type"]');
        fieldTypeRadios.forEach(radio => {
            radio.addEventListener('change', function() {
                currentFieldType = this.value;
                // Reset point positions for new field
                const config = getFieldConfig();
                fieldPositions.A = { x: 0, y: -config.width / 2 - 3 };
                fieldPositions.B = { x: config.length / 2, y: config.width / 2 };
                draw();
            });
        });

        // Initial draw
        draw();
    </script>
</body>
</html>
